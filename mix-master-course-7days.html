<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIX & MASTER · คอร์ส 7 วัน</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@700;900&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--y:#FFE14D;--p:#FF5DA2;--c:#4DE8FF;--l:#B8FF5C;--o:#FF8A3D;--ink:#0d0d0d;--bg:#FFF8E7}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:17px;line-height:1.75}
h1,h2,h3{font-family:'Kanit',system-ui,sans-serif;font-weight:900;line-height:1.2}
#bar{position:fixed;left:0;top:0;height:6px;background:var(--p);width:0;z-index:20;border-bottom:2px solid var(--ink)}
nav{position:sticky;top:0;z-index:10;background:var(--y);border-bottom:4px solid var(--ink);display:flex;gap:8px;padding:10px 14px;overflow-x:auto;align-items:center}
.brand{font-family:'Kanit',sans-serif;font-weight:900;margin-right:auto;white-space:nowrap}
nav a{color:var(--ink);text-decoration:none;font-weight:700;border:3px solid var(--ink);background:#fff;padding:4px 10px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
nav a:hover{background:var(--p)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
#hero{position:relative;height:62vh;min-height:380px;border-bottom:4px solid var(--ink);background:var(--c);overflow:hidden}
#hero3d{position:absolute;inset:0}
.hero-text{position:absolute;left:0;right:0;bottom:24px;text-align:center;pointer-events:none}
.hero-text h1{font-size:clamp(40px,8vw,84px);display:inline-block;background:#fff;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:0 18px;line-height:1.3}
.badge{display:inline-block;background:var(--ink);color:var(--y);padding:6px 14px;font-weight:700;margin-top:10px;border:3px solid var(--ink)}
.day{padding:40px 0;border-bottom:4px dashed var(--ink)}
.day-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:18px}
.num{background:var(--p);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);font-family:'Kanit',sans-serif;font-weight:900;font-size:44px;width:96px;height:96px;display:grid;place-items:center;flex-shrink:0}
.hours{display:inline-block;background:var(--l);border:3px solid var(--ink);padding:2px 12px;font-weight:700;box-shadow:4px 4px 0 var(--ink);margin-top:6px}
.card{background:#fff;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:22px;margin:0}
.goal{margin-bottom:22px;background:var(--y)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid .card h3{margin-bottom:6px}
.tip{background:var(--l);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px 18px;margin-top:22px}
.tip b{font-family:'Kanit',sans-serif;font-weight:900}
.demo{margin-top:22px;background:var(--c)}
label{font-weight:700;display:block;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--p);height:22px}
.meter{height:34px;border:4px solid var(--ink);background:#fff;margin-top:12px;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--o);border-right:4px solid var(--ink);width:0}
.out{font-family:'Kanit',sans-serif;font-weight:900;font-size:22px;margin-top:10px}
.shot{margin-top:22px;border:4px dashed var(--ink);background:repeating-linear-gradient(45deg,#fff 0 12px,var(--bg) 12px 24px);padding:26px;text-align:center;font-weight:700}
.shot small{display:block;font-weight:400;margin-top:6px}
.sub{margin:28px 0 4px;font-size:26px}
.lesson{margin-top:18px;padding:0}
.lesson summary{list-style:none;cursor:pointer;padding:18px 22px;background:#fff}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary h3{display:inline}
.lesson[open] summary{border-bottom:4px solid var(--ink);background:var(--y)}
.lesson>p,.lesson>ol{padding:0 22px}
.lesson>p:first-of-type{padding-top:16px}
.steps{margin:12px 0;padding-left:44px}
.steps li{margin:6px 0}
.ex{background:var(--l);border-top:4px solid var(--ink);padding:14px 22px;margin:14px 0 0}
.kp{list-style:none;padding:0;counter-reset:k}
.kp li{counter-increment:k;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 14px 10px 58px;margin:12px 0;position:relative}
.kp li::before{content:counter(k);position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:'Kanit',sans-serif;font-weight:900;background:var(--p);border:3px solid var(--ink);width:32px;height:32px;display:grid;place-items:center}
.viz{margin:22px 0 0}
.viz svg{width:100%;height:auto;display:block;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.viz figcaption{font-weight:700;margin:10px 0 0}
footer{padding:40px 18px;background:var(--ink);color:var(--y);text-align:center;font-weight:700}
@media (max-width:600px){.num{width:72px;height:72px;font-size:32px}}
</style>
</head>
<body>
<div id="bar"></div>
<nav id="nav"><span class="brand">MIX&amp;MASTER</span><a href="#home">หน้าแรก</a></nav>

<header id="home">
  <section id="hero">
    <div id="hero3d"></div>
    <div class="hero-text">
      <h1>MIX &amp; MASTER</h1>
      <span class="badge">คอร์ส 7 วัน · 14 ชั่วโมง · ตั้งแต่พื้นฐานถึงพร้อมปล่อยเพลง</span>
    </div>
  </section>
</header>

<main class="wrap" id="main"></main>

<footer>MIX &amp; MASTER · สร้างเพื่อนักเรียน · ฟังให้เยอะ แล้วเชื่อหูของตัวเองมากขึ้นทุกวัน</footer>

{
 t:'พื้นฐานเสียงและภาพรวม', h:'2 ชม.',
 goal:'เข้าใจความต่างของ Mix กับ Master และเตรียมระดับเสียงให้ถูกตั้งแต่ต้น',
 items:[
  ['เสียงคืออะไร','ความถี่ (Hz) คือความสูงต่ำของเสียง ส่วนแอมพลิจูด (dB) คือความดัง ต้องดูทั้งสองอย่างคู่กันเสมอ'],
  ['Mix vs Master','Mix คือทำให้ทุกแทร็กอยู่ด้วยกันได้ลงตัว ส่วน Master คือขัดเกลาทั้งเพลงให้พร้อมเผยแพร่'],
  ['Gain staging และ Headroom','ปรับระดับแต่ละแทร็กให้เหมาะก่อน และเผื่อพื้นที่ประมาณ -6 dB ที่ Master bus'],

 deep:[
  {t:'เสียงคืออะไรจริง ๆ', p:'เสียงคือการสั่นของอากาศที่หูรับรู้ ความถี่วัดเป็นรอบต่อวินาทีหรือ Hz หูคนได้ยินราว 20 Hz ถึง 20 kHz โดยเสียงต่ำอย่างคิกและเบสอยู่ฝั่งล่าง ส่วนแฮท ซิมบอล และแอร์อยู่ฝั่งบน ในดิจิทัลระดับสูงสุดคือ 0 dBFS ค่าที่ติดลบคือเบากว่าเพดานนั้น', s:['เปิด Peak meter ใน Mixer ของ FL Studio ให้เห็นค่าเป็น dB','สร้าง sine wave ที่ 50 Hz 1 kHz และ 10 kHz แล้วฟังว่าความดังรู้สึกต่างกันอย่างไร'], ex:'เปรียบเทียบ sine 100 Hz กับ 1 kHz ที่ระดับ dB เท่ากัน แล้วบันทึกว่าหูรู้สึกดังเท่ากันหรือไม่'},
  {t:'Mix กับ Master ต่างกันตรงไหน', p:'งาน Mix ทำกับแทร็กแยกทีละชิ้น เพื่อให้เครื่องดนตรีแต่ละชิ้นมีที่ของตัวเองในความดัง ความถี่ และตำแหน่งซ้ายขวา งาน Master ทำกับไฟล์สเตอริโอสุดท้าย เพื่อให้ความดัง โทน และความกว้างสม่ำเสมอ และเข้ากันได้กับทุกแพลตฟอร์ม ถ้า Mix ยังผิดพื้นฐาน Master จะแก้ได้จำกัด', s:['ฟังเพลงเดียวกันสองเวอร์ชัน ก่อนและหลัง Master แล้วจดสิ่งที่เปลี่ยน','ปิดแทร็กทีละชิ้นแล้วดูว่าเพลงขาดอะไรไป'], ex:'เขียนสิ่งที่คุณคิดว่าเป็นงาน Mix และงาน Master อย่างละ 3 ข้อ'},
  {t:'Gain staging ทีละขั้น', p:'ระดับ peak ที่เหมาะของแต่ละแทร็กควรอยู่ราว -10 ถึง -6 dB ก่อนเข้า bus ใช้ fader ของ Mixer เป็นตัวปรับหลัก ไม่ใช่ปลั๊กอิน ระดับที่เผื่อไว้ช่วยให้ปลั๊กอินทำงานได้โดยไม่บิดเบี้ยว และทำให้ limiter ที่ master ไม่ต้องทำงานหนักเกินไป', s:['เปิดเพลงทั้งหมด แล้วลด fader ของทุกแทร็กจนไม่มี peak เกิน -6 dB ที่ master','ค่อยเริ่มใส่ EQ และ Compressor หลังจากระดับนิ่งแล้ว'], ex:'จดค่า peak ของ master ก่อนและหลังลด fader แล้วเปรียบเทียบ'},

  {t:'ศัพท์พื้นฐานที่ควรรู้', p:'Insert คือปลั๊กอินที่ต่อตามลำดับในแทร็ก Send คือการส่งสัญญาณบางส่วนไปยัง bus ร่วม Bus คือแทร็กที่รวมหลายแทร็กเข้าด้วยกัน Clip คือสัญญาณที่เกินเพดานจนบิดเบี้ยว Transient คือช่วงเริ่มต้นที่เร็วและดังของเสียง Dynamic range คือช่องว่างระหว่างเสียงเบาสุดกับดังสุดในเพลง', s:['เขียนนิยามศัพท์ทั้งหกด้วยคำของตัวเอง','หาตัวอย่างในโปรเจกต์ของตัวเองให้ครบทุกคำ'], ex:'อธิบายแต่ละคำให้เพื่อนฟังโดยไม่ดูโน้ต แล้วให้เพื่อนทายว่าคำไหนผิด'},

 deep:[
  {t:'ประเภทของ Filter ใน EQ', p:'High-pass ตัดทุกอย่างที่ต่ำกว่าความถี่ที่ตั้ง Low-pass ตัดทุกอย่างที่สูงกว่า Shelf ปรับทั้งย่านด้านบนหรือด้านล่างแบบนุ่ม ส่วน Bell หรือ Peaking ปรับเฉพาะจุดตรงกลาง ความกว้างของจุดนั้นควบคุมด้วย Q ค่า Q สูงให้จุดแคบและแม่น ค่า Q ต่ำให้จุดกว้างและนุ่ม', s:['ใส่ HPF บนแทร็กเสียงร้องแล้วขยับความถี่ขึ้นจนเสียงเริ่มบางลง จดค่านั้นไว้','ปรับ Q ของ Bell ระหว่างค่าต่ำและสูงเพื่อฟังความต่าง'], ex:'ใช้ Bell ที่ Q ต่างกันกับเสียง noise แล้วเทียบว่าจุดไหนดูแคบหรือกว้าง'},
  {t:'Masking: เครื่องดนตรีชนกันตรงไหน', p:'เสียงสองชิ้นที่มีความถี่ทับกันจะทำให้ฟังแล้วจม เรียกว่า masking วิธีหาคือ solo แทร็กคู่ที่สงสัยแล้วฟังทีละคู่ หรือเปิด spectrum analyzer ดูจุดที่ทับกันมาก จากนั้นให้ชิ้นหนึ่งลดย่านนั้นลงเล็กน้อย อีกชิ้นจะได้พื้นที่ไป', s:['Solo คิกกับเบส แล้วฟังว่าย่าน 50 ถึง 120 Hz ทับกันหรือไม่','ตั้งค่า EQ ให้คิกโดดขึ้นโดยลดเบสในช่วงเดียวกันเล็กน้อย'], ex:'เลือกเครื่องดนตรีสองชิ้นที่ชนกัน หาจุดชนแล้วจัดให้แยกกันได้'},
  {t:'EQ ตามเครื่องดนตรี (จุดเริ่มต้น)', p:'คิกมักดันที่ราว 60 ถึง 80 Hz เพื่อให้มีน้ำหนัก และตัดโคลนราว 300 ถึง 400 Hz ถ้าเสียงทึบ เบสมักตัดที่ราว 200 ถึง 300 Hz เพื่อไม่ให้เลอะกับโลว์มิด เสียงร้องควร HPF ประมาณ 100 Hz เพิ่มความชัดที่ 3 ถึง 5 kHz และเพิ่ม air ที่ 10 kHz ขึ้นไป ค่าเหล่านี้เป็นจุดเริ่มต้นเท่านั้น ต้องฟังประกอบกับเพลงจริงเสมอ', s:['ตั้ง EQ คิกให้มีน้ำหนักโดยไม่บวม แล้วเทียบกับเพลงอ้างอิง','ทำ HPF ที่เสียงร้องแล้วฟังว่าสะอาดขึ้นหรือบางลงเกินไป'], ex:'ทำ EQ ให้เสียงร้องและเบส แล้วฟังซ้ำหลังพัก 1 ชั่วโมง'},
  {t:'HPF และ LPF ทีละเครื่องดนตรี', p:'ไม่ใช่ทุกแทร็กที่ควรมีเบส การตัดความถี่ต่ำออกจากเครื่องดนตรีที่ไม่ได้เล่นย่านนั้นช่วยให้เบสและคิกมีที่ว่างมากขึ้น ส่วน LPF ใช้คุมความแหลมของเสียงที่ดังเกินหรือเสียงรบกวนจากการบันทึก', s:['ไล่ดูทีละแทร็กแล้วถามว่าแทร็กนี้ต้องใช้ความถี่ต่ำถึงระดับไหน','ตั้ง LPF บนแทร็กที่มีเสียงรบกวนสูงแล้วลดลงจนเสียงยังชัดแต่ไม่แข็ง'], ex:'ตั้ง HPF ให้แทร็กทั้งหมดที่ไม่ใช่เบสและคิก แล้วฟังว่าเพลงโปร่งขึ้นหรือไม่'},
  {t:'Boost กับ Cut ต่างกันอย่างไร', p:'การ cut มักให้ผลที่เป็นธรรมชาติกว่า เพราะเป็นการเอาเสียงที่รบกวนออก ส่วน boost ที่แรงมักทำให้เสียงแข็งหรือบิดเบี้ยว หลักที่ควรจำคือถ้าต้องการเพิ่มเสียง ลองหาอย่างอื่นที่ทำให้เสียงนั้นชัดขึ้นโดยการลดเสียงรอบข้างก่อน', s:['ทำ boost ที่ +6 dB แล้วลองลดลงเหลือ +2 dB และฟังความต่าง','ทดลอง cut หนึ่งจุดแล้วเทียบกับการ boost ที่ความดังเท่ากัน'], ex:'เลือกแทร็กหนึ่งแล้วทำให้ชัดขึ้นด้วย cut เท่านั้น แล้วจดว่าทำได้หรือไม่'},
  {t:'Linear phase และ Minimum phase', p:'EQ แบบ Minimum phase เป็นค่าเริ่มต้นของหลายปลั๊กอิน และให้เสียงที่ธรรมชาติกับเสียงกลองและเสียงร้อง ส่วน Linear phase ไม่เปลี่ยนเฟสแต่ใช้ทรัพยากรมากกว่าและอาจมีเสียงก่อนหน้า (pre-ringing) ที่ไม่พึงประสงค์ในบางเสียง', s:['เปรียบเทียบ EQ สองโหมดกับแทร็กเดียวกันที่ความดังเท่ากัน','สังเกตว่าเสียงกลองหรือเสียงร้องเปลี่ยนไปหรือไม่'], ex:'ลองใช้ Linear phase กับเพลงที่เป็นเสียงกลองล้วน แล้วฟังว่ามีเสียงก่อนหน้าให้ได้ยินไหม'},
  {t:'EQ ที่ bus และ master ทำอะไรได้บ้าง', p:'เมื่อ EQ ที่ bus หรือ master ทำงานกับเพลงทั้งเพลง การปรับแต่ละครั้งจะกระทบทุกเครื่องดนตรีพร้อมกัน จึงควรใช้ค่ากว้างและอ่อนเท่านั้น และถ้าต้องปรับเยอะให้กลับไปแก้ที่แทร็กต้นทาง', s:['เปิด EQ ที่ bus แล้วปรับค่าเล็กน้อยทีละจุด','ปิดเปิดเทียบกับเพลงทั้งเพลงทุกครั้ง'], ex:'ทำ EQ ที่ bus โดยไม่เกิน 1 dB แล้วบันทึกว่าเปลี่ยนอะไรไปบ้าง'},
  {t:'Spectrum analyzer กับการฟัง', p:'กราฟความถี่ช่วยให้เห็นว่าย่านไหนแน่นหรือบาง แต่ไม่ควรเชื่อกราฟอย่างเดียว เพราะหูเป็นตัวตัดสินสุดท้าย ใช้กราฟเพื่อหาจุดที่น่าสนใจ แล้วฟังว่าจุดนั้นฟังแล้วรู้สึกอย่างไร', s:['เปิด spectrum analyzer แล้วดูย่านที่มีพลังงานสูงที่สุด','ฟังย่านนั้นโดยตรงด้วย solo และ EQ แบบ bell แคบ'], ex:'เปิดกราฟแล้วหาย่านที่แน่นที่สุดสามจุด จากนั้นฟังทีละจุดแล้วบันทึกความรู้สึก'},
  {t:'ทบทวน EQ ก่อนไปต่อ', p:'ก่อนขึ้นบทถัดไป ให้ทบทวนทุกแทร็กในโปรเจกต์ว่ามี HPF หรือไม่ ย่านที่ชนกันถูกจัดการแล้วหรือยัง และ EQ ทั้งหมดเป็นการ cut มากกว่า boost หรือไม่ การทบทวนนี้ช่วยให้ไม่ปรับจนเกินจำเป็น', s:['ไล่ดูแทร็กทั้งหมดทีละตัวด้วยเช็กลิสต์ EQ','บันทึกค่าที่ปรับไว้เพื่อดูย้อนหลัง'], ex:'ทำเช็กลิสต์ EQ ของตัวเองสิบข้อ แล้วใช้กับโปรเจกต์ทุกครั้งที่เริ่มงาน'}

  {t:'Sidechain ทีละขั้นตอน', p:'Sidechain คือการให้สัญญาณจากแทร็กหนึ่งไปควบคุม Compressor ของอีกแทร็กหนึ่ง ใช้บ่อยที่สุดในการทำให้เบสหลบคิก ทำให้คิกชัดขึ้นโดยไม่ต้องลดความดังของคิกเอง', s:['ใส่ Compressor บนแทร็กเบส แล้วเปิดการทำงานแบบ Sidechain','ในเมนู sidechain ของปลั๊กอิน เลือกแทร็กคิกเป็นสัญญาณควบคุม แล้วปรับ threshold ให้เบสหลบเมื่อคิกเข้า'], ex:'ทำ sidechain ให้เบสในเพลงของคุม แล้วฟังว่าคิกชัดขึ้นหรือไม่'},
  {t:'Compressor แบบ Feed-forward และ Feedback', p:'Feed-forward ตรวจจับสัญญาณก่อนเข้าตัวบีบ ทำให้ควบคุมได้แม่นและคาดเดาได้ ส่วน Feedback ใช้สัญญาณหลังบีบมาตรวจจับ ให้ความรู้สึกอุ่นและเป็นธรรมชาติกว่าในบางเสียง เลือกตามลักษณะของเสียงที่กำลังทำ', s:['เปรียบเทียบสองโหมดกับเสียงร้องที่ความดังเท่ากัน','สังเกตว่าโหมดไหนให้ความนุ่มมากกว่า'], ex:'บีบเสียงเบสด้วยสองโหมด แล้วบันทึกว่าโหมดไหนให้ความรู้สึกแน่นกว่า'},
  {t:'Auto makeup gain และการเทียบความดัง', p:'เมื่อบีบแล้วเสียงดังขึ้นหรือเบาลง หูจะชอบเสียงที่ดังกว่าโดยไม่รู้ตัว ดังนั้นต้องปรับ makeup gain ให้ความดังเท่ากันก่อน จึงจะตัดสินได้ว่าเสียงบีบดีขึ้นจริงหรือไม่ การ bypass แล้วเปิดสลับบ่อย ๆ ช่วยได้มาก', s:['เปิดปิด bypass ทีละครั้งโดยให้ความดังเท่ากันตลอด','ปรับ makeup gain จนความดังใกล้เคียงกับตอนที่ปิด'], ex:'บีบเสียงร้องแล้วเทียบสองเวอร์ชันที่ความดังเท่ากัน จดว่าเวอร์ชันไหนน่าฟังกว่า'},
  {t:'Upward compression ยกเสียงเบา', p:'Compressor ปกติลดเสียงดัง แต่ Upward compression ยกเสียงที่เบาเกินไปให้ขึ้นมาใกล้ระดับหลัก เหมาะกับเสียงที่บางช่วงหายไป เช่นเสียงร้องที่เบาในบางท่อนหรือเสียงกีตาร์ที่แผ่วลง', s:['ตั้งค่า upward ให้ยกเสียงที่เบาขึ้นเพียงเล็กน้อย','ฟังว่าเสียงที่หายไปกลับมาหรือไม่โดยไม่ดังเกิน'], ex:'ทดลอง upward compression กับเสียงร้องที่มีช่วงเบาไม่สม่ำเสมอ แล้วฟังผล'},
  {t:'Transient shaper ควบคุมหัวเสียง', p:'Transient shaper ไม่ได้บีบระดับโดยตรง แต่ปรับความดังของช่วงเริ่มต้นกับช่วงคลายตัวของเสียง ทำให้กลองมีหัวที่คมขึ้นหรือหางที่ยาวขึ้น เหมาะกับดรัมที่เสียงไม่แน่นหรือขาดความคมโดยไม่ต้องเพิ่มความดังรวม', s:['เพิ่ม attack ทีละนิดกับคิกแล้วฟังความคม','ลด sustain เพื่อให้กลองไม่บวม'], ex:'ปรับ transient ของกลองชุดให้คมขึ้น โดยไม่เพิ่ม gain รวมของแทร็ก'},
  {t:'Multiband compression เบื้องต้น', p:'Multiband แยกความถี่แล้วบีบแต่ละย่านแยกกัน ทำให้คุมเบสได้โดยไม่กระทบแหลม การใช้ในขั้นนี้เน้นให้เข้าใจแนวคิด แล้วค่อยใช้จริงในวันที่ 6 เมื่อต้องการควบคุมทั้งเพลง', s:['เปิด multiband บนแทร็กเบสแล้วบีบเฉพาะย่านต่ำ','ดูว่าย่านอื่นยังทำงานเหมือนเดิมหรือไม่'], ex:'ทดลอง multiband กับแทร็กเบสโดยบีบเพียงย่านเดียว แล้วฟังความแตกต่าง'},
  {t:'Compressor บนดรัมแต่ละชิ้น', p:'คิก สแนร์ และแฮท แต่ละชิ้นต้องการการบีบที่ต่างกัน คิกมักต้องการ attack ที่เร็วแต่ release ที่พอดีกับจังหวะ สแนร์อาจต้องการความอวบจากการบีบเบา ๆ ส่วนแฮทมักบีบน้อยเพื่อรักษาความโปร่ง', s:['บีบคิกด้วยค่าที่เร็ว แล้วฟังว่าเสียงมีน้ำหนักขึ้นหรือไม่','บีบสแนร์เบา ๆ แล้วเทียบความอวบ'], ex:'ตั้งค่า compressor ให้ดรัมสามชิ้น แล้วฟังว่าเสียงรวมแน่นขึ้นหรือไม่'},
  {t:'ทบทวนการบีบก่อนไปต่อ', p:'ตรวจทุกแทร็กว่าบีบเกิน 3 ถึง 6 dB หรือไม่ และดูว่ามีการบีบซ้อนกันหลายตัวโดยไม่จำเป็นหรือไม่ การทบทวนช่วยลดการบีบที่สะสมจนเสียงแบนและไม่มีชีวิต', s:['ไล่ดูค่า gain reduction ของทุกแทร็ก','ปิด compressor ทั้งหมดแล้วเปิดกลับทีละตัวเพื่อตรวจว่าจำเป็นหรือไม่'], ex:'เขียนเช็กลิสต์การบีบของคุณสิบข้อ แล้วใช้ทุกครั้งที่ทำเพลงใหม่'}
],

 deep:[
  {t:'กายวิภาคของ Reverb', p:'Reverb ประกอบด้วย pre-delay ที่เว้นช่วงก่อนเสียงสะท้อน early reflections คือเสียงสะท้อนแรกที่บอกขนาดห้อง และ decay ที่บอกว่าเสียงหายช้าหรือเร็ว การ damping ลดความถี่สูงในเสียงสะท้อนให้นุ่มขึ้น ควรใช้แบบ send ร่วมกันทั้งเพลง ไม่ควรใส่ reverb แยกทุกแทร็กจนห้องแตกเป็นหลายห้อง', s:['สร้าง send ไป reverb แล้วปรับเฉพาะเสียงร้องเล็กน้อย','เพิ่ม pre-delay ทีละนิดเพื่อให้เสียงร้องชัดก่อนห้องจะตอบ'], ex:'ตั้ง decay สั้นให้ดรัม และยาวให้แพด แล้วฟังความต่าง'},
  {t:'Delay: Ping-pong, Feedback และ Ducking', p:'Delay ที่ sync กับ BPM ทำให้เสียงแน่นตามจังหวะ ping-pong กระจายสะท้อนซ้ายขวา ควรตัด high และ low ใน feedback เพื่อไม่ให้เสียงสะท้อนชนกับเสียงหลัก บางครั้งลดความดังของ delay ตอนเสียงหลักดัง เรียกว่า ducking', s:['ตั้ง delay เป็น 1/8 dotted แล้วลอง feedback ที่ต่ำ','เปิดตัวกรองในวงเสียงสะท้อนให้เสียงอุ่นขึ้น'], ex:'ใส่ delay ให้เสียงร้องหนึ่งชิ้นโดยไม่ให้เปียกเกินไป'},
  {t:'Stereo, Mid/Side และการเช็กโมโน', p:'Mid/Side แยกเสียงตรงกลางกับเสียงด้านข้าง ทำให้ปรับความกว้างได้โดยไม่กระทบเสียงหลัก เบส คิก และเสียงร้องหลักควรอยู่กลาง เพื่อให้พลังและความชัดไม่หาย การเช็กโมโนบ่อย ๆ ช่วยให้เห็นปัญหาเฟสที่อาจทำให้เสียงหายเมื่อเล่นบนลำโพงเดียว', s:['เปิด Mid/Side แล้วลดด้านข้างของเบสให้ต่ำลง','สลับเป็นโมโนแล้วฟังว่าเสียงหายตรงไหน'], ex:'เช็กโมโนเพลงที่คุณทำ แล้วบันทึกว่าเครื่องดนตรีชิ้นไหนหายไปมากที่สุด'},
  {t:'Pre-delay และ Decay ตามจังหวะเพลง', p:'Pre-delay ที่ตรงกับจังหวะ เช่น 1/16 หรือ 1/8 ทำให้เสียงร้องไม่จมในห้องเสียง ส่วน decay ที่ยาวเกินไปทำให้เนื้อเพลงฟังไม่ชัดในท่อนเร็ว ควรปรับให้สั้นลงเมื่อจังหวะเร็วขึ้น', s:['ตั้ง pre-delay เป็นค่าที่สัมพันธ์กับ BPM แล้วทดลองสามค่า','ลด decay ลงเมื่อเพลงมีจังหวะถี่'], ex:'ทำ reverb ให้เสียงร้องในท่อนช้าและท่อนเร็ว แล้วฟังว่าความชัดต่างกันอย่างไร'},
  {t:'Reverb ประเภท Room, Hall และ Plate', p:'Room จำลองห้องเล็กที่มีเสียงสะท้อนใกล้ชิด เหมาะกับเสียงที่ต้องการความเป็นธรรมชาติ Hall ให้ห้องใหญ่และยาว เหมาะกับแพดหรือเสียงที่ต้องการบรรยากาศ ส่วน Plate ให้เสียงสะท้อนที่เรียบและเข้าได้กับเสียงร้องหลายแนว', s:['ใส่ reverb สามประเภทกับเสียงร้องเดียวกันแล้วฟังทีละแบบ','เลือกแบบที่ไม่แย่งความชัดของเสียงหลัก'], ex:'เลือกประเภท reverb หนึ่งแบบให้เสียงร้อง และอีกแบบให้เครื่องดนตรีประกอบ แล้วเทียบ'},
  {t:'Send และ Insert ต่างกันอย่างไร', p:'Insert วางปลั๊กอินตรงในสายสัญญาณของแทร็กโดยตรง ส่วน Send ส่งสัญญาณบางส่วนไปยังปลั๊กอินที่แยกออกไป การใช้ send ช่วยให้ reverb หรือ delay ตัวเดียวทำงานร่วมกันหลายแทร็กได้ และควบคุมปริมาณของแต่ละแทร็กได้แยกกัน', s:['สร้าง send หนึ่งตัวไปยัง reverb แล้วปรับปริมาณของแทร็กต่าง ๆ','เปรียบเทียบกับการใส่ reverb เป็น insert บนทุกแทร็ก'], ex:'ใช้ send หนึ่งตัวสำหรับทั้งเพลง แล้วฟังว่าห้องเสียงรวมเป็นหนึ่งเดียวหรือไม่'},
  {t:'Wet และ Dry ในการผสมเสียง', p:'Wet คือสัญญาณที่ผ่านเอฟเฟกต์แล้ว ส่วน Dry คือสัญญาณต้นฉบับ การผสมที่ดีคือให้ Dry เป็นหลักและ Wet เป็นส่วนเสริม ถ้า wet เด่นกว่า เสียงหลักจะจมและฟังเหมือนอยู่ในถ้ำ', s:['ลด wet ของ reverb ลงทีละนิดจนเกือบรู้สึกว่าหายไป','เปิดกลับแล้วดูว่าเสียงโดดหรือหายไปหรือไม่'], ex:'ทำให้เสียงร้องมี wet ไม่เกิน 20 เปอร์เซ็นต์ แล้วฟังว่าชัดแค่ไหน'},
  {t:'Stereo imaging ของเสียงซ้อน', p:'เสียงที่ซ้อนหลายเลเยอร์อาจทำให้เสียงกว้างเกินไปและเบลอ การวางเลเยอร์แต่ละชิ้นในตำแหน่งที่ต่างกันเล็กน้อย และให้เสียงหลักอยู่กลาง ช่วยให้ภาพสเตอริโอชัดและไม่รก', s:['วาง pan ของเลเยอร์แต่ละชิ้นให้ต่างกันเล็กน้อย','เช็กโมโนว่าเลเยอร์ไม่หักล้างกัน'], ex:'ซ้อนเสียงสองเลเยอร์ แล้วปรับ pan และฟังว่าภาพเสียงชัดขึ้นไหม'},
  {t:'Ducking ของ delay และ reverb', p:'เสียงสะท้อนบางครั้งกลบเสียงหลักเมื่อเพลงหนาแน่น การลดความดังของ delay หรือ reverb ตอนเสียงหลักดัง ทำให้เสียงหลักชัดขึ้นโดยยังคงความรู้สึกของห้องไว้', s:['ใช้ Sidechain กับ delay โดยให้เสียงหลักเป็นสัญญาณควบคุม','ปรับระดับการลดให้พอดีกับความดังของเสียงหลัก'], ex:'ทำ ducking ให้ delay ของเสียงร้อง แล้วฟังว่าเสียงร้องชัดขึ้นหรือไม่'},
  {t:'ทบทวนพื้นที่เสียงก่อนไปต่อ', p:'ตรวจว่าทุกเครื่องดนตรีมีที่ของตัวเองในห้องเสียงหรือไม่ และเสียงสะท้อนไม่กลบเสียงหลักในช่วงที่หนาแน่นที่สุด การทบทวนนี้ช่วยให้เพลงโปร่งและมีมิติ', s:['เปิดเพลงทั้งเพลงแล้วหาช่วงที่รกที่สุด','ลด send หรือ wet ในช่วงนั้นให้เสียงโปร่งขึ้น'], ex:'เขียนเช็กลิสต์พื้นที่เสียงของคุมสิบข้อ แล้วใช้ทุกครั้งที่ทำ mix'}

  ['Bus compression','บีบเบา ๆ ราว 1–2 dB ที่ bus เพื่อให้เพลงแน่นและเกาะกลุ่ม'],
  ['Saturation','เพิ่มฮาร์มอนิกให้เสียงอบอุ่นและเด่นขึ้น ใช้น้อยเพื่อให้รู้สึกได้โดยไม่บิด'],

 deep:[
  {t:'ลำดับ Mix Bus ที่ควรใช้', p:'ลำดับทั่วไปที่ใช้ได้ดีคือ EQ แก้ความถี่รวมก่อน แล้วค่อย Compressor เบา ๆ ตามด้วย Saturation เพื่อเติมความอบอุ่น และ Limiter เบา ๆ เป็นตัวสุดท้ายถ้าต้องการ ทุกขั้นควรปรับแค่เล็กน้อย เพราะบน bus เสียงทั้งเพลงจะเปลี่ยนเร็วมาก', s:['ใส่ EQ ที่ bus ตัดย่านที่ทับกันเพียงเล็กน้อย','ใส่ Compressor ที่ bus ให้ gain reduction 1 ถึง 2 dB'], ex:'จัดลำดับ bus ใหม่สองแบบ แล้วฟังว่าแบบไหนเพลงนิ่งกว่า'},
  {t:'Saturation: ประเภทและการใช้', p:'Saturation เพิ่มฮาร์มอนิกที่ทำให้เสียงอบอุ่นและเด่นขึ้น แบบ tape ให้ความนุ่มและการบีบเล็กน้อย แบบ tube ให้ความอุ่นของฮาร์มอนิกคู่ ส่วนแบบ clip ให้ความดุดันและแรงขึ้น ควรเปิด oversampling เพื่อลดเสียงรบกวนจากการบิดสัญญาณ และใช้ในปริมาณน้อยให้รู้สึกได้โดยไม่ได้ยินเป็นการบิด', s:['เปิดปิด saturation บน bus แล้วฟังความต่าง','ลองสามประเภทกับเพลงเดียวกันแล้วเลือกที่เข้ากับแนวเพลง'], ex:'ทำ A/B ระหว่างเปิดกับปิด saturation แล้วจดว่าเสียงเด่นขึ้นตรงไหน'},
  {t:'ความสมดุลและเช็กลิสต์ของ Mix', p:'เสียงร้องหลักควรเด่นที่สุด จากนั้นเป็นเบสและคิก แล้วจึงเป็นเครื่องดนตรีประกอบ ความดังที่ต่างกันเพียง 1 dB ก็ฟังออกได้ ดังนั้นต้องปรับให้ความดังเท่ากันก่อนเทียบ เช็กลิสต์ควรถามว่าเสียงหลักชัดไหม จังหวะแน่นไหม และมีที่ว่างพอไหม', s:['เปิดเพลงอ้างอิงที่ชอบ ปรับความดังให้เท่ากับเพลงของเรา แล้วเทียบ','จัดลำดับความดังของเครื่องดนตรีบนกระดาษ แล้วตรวจกับ mix จริง'], ex:'เขียนเช็กลิสต์ 10 ข้อของคุณเอง แล้วใช้กับทุกเพลงที่ทำ'},
  {t:'Bus compressor และการเกาะกลุ่ม', p:'Bus compressor ที่บีบเบามากช่วยให้เครื่องดนตรีทั้งหมดขยับไปด้วยกันเหมือนอยู่ในวงเดียวกัน การใช้ attack ช้าและ release ปานกลางช่วยให้จังหวะไม่ถูกทำลาย ควรตรวจว่าเพลงยังมีพลวัตอยู่ไม่ใช่แบนจนเกินไป', s:['ตั้ง attack ช้า release ปานกลาง แล้วบีบราว 1 dB','ฟังว่าเพลงรวมเป็นก้อนเดียวโดยไม่สูญเสียจังหวะหรือไม่'], ex:'บีบ bus หนึ่งครั้งแบบเบา แล้วฟังเทียบกับตอนปิด จดว่าเพลงรวมตัวดีขึ้นหรือไม่'},
  {t:'Saturation แบบขนาน', p:'การผสม saturation กลับเข้ากับเสียงต้นฉบับแบบขนาน ช่วยให้ได้ความอบอุ่นและความดุดันโดยไม่ทำให้เสียงบิดมากเกินไป เหมาะกับ bus ที่ต้องการความเด่นแต่ยังต้องการความเป็นธรรมชาติ', s:['สร้างแทร็กซ้ำจาก bus แล้วใส่ saturation เฉพาะแทร็กนั้น','ปรับปริมาณผสมให้เสียงแบบขนานพอประมาณ'], ex:'ทำ saturation แบบขนานบน bus แล้วฟังว่าเสียงเด่นขึ้นโดยไม่แข็งหรือไม่'},
  {t:'Mix bus limiter เบื้องต้น', p:'Limiter บน bus ช่วยกันสัญญาณจากการเกินเพดานในระหว่างการทำงาน แต่ไม่ควรใช้เพื่อดันความดังมากเกินไป เป้าหมายคือการควบคุมปลายยอดเสียง ให้ระดับเพียงพอสำหรับการทำงานที่ master', s:['ตั้ง limiter บน bus ให้ลดปลายยอดเพียงเล็กน้อย','ตรวจว่าเสียงยังมีพลวัตอยู่'], ex:'ใส่ limiter บน bus แล้วจดค่าลดสูงสุดที่เกิดขึ้น ต้องไม่เกินไม่กี่ dB'},
  {t:'การเทียบกับเพลงอ้างอิงแบบเต็ม', p:'การเทียบที่ดีต้องเทียบเพลงทั้งเพลงในความดังที่เท่ากัน ไม่ใช่แค่ช่วงสั้น ๆ การฟังช่วงต่าง ๆ ของเพลง เช่น ท่อนเปิด ท่อนหลัก และท่อนจบ ช่วยให้เห็นว่าเพลงของเรามีโครงสร้างความดังที่ใกล้เคียงหรือไม่', s:['เลือกเพลงอ้างอิงและปรับความดังให้เท่ากัน','ฟังสามช่วงของเพลงแล้วเทียบโครงสร้างความดัง'], ex:'เทียบเพลงของคุณกับอ้างอิงหนึ่งเพลงในสามช่วงสำคัญ แล้วจดความต่างที่พบ'},
  {t:'การฟังผ่านลำโพงและหูฟัง', p:'ลำโพงและหูฟังให้ภาพเสียงต่างกัน หูฟังเผยรายละเอียดและการแยกซ้ายขวาได้ดี ส่วนลำโพงให้ความรู้สึกของพื้นที่และความถี่ต่ำที่แท้จริงกว่า ควรฟังทั้งสองแบบก่อนสรุปผลงานทุกครั้ง', s:['ฟังงานในหูฟังและลำโพงสลับกันไปมา','จดปัญหาที่พบในแต่ละอุปกรณ์แยกกัน'], ex:'ฟังเพลงเดียวกันในหูฟังและลำโพง แล้วบันทึกสามสิ่งที่ต่างกันมากที่สุด'},
  {t:'ความล้าของหูและการพักฟัง', p:'หูจะเริ่มปรับตัวกับเสียงดังและแหลมหลังฟังนาน ทำให้การตัดสินใจเพี้ยนไป การพักหูสั้น ๆ ทุกชั่วโมงและกลับมาฟังด้วยความดังต่ำ ช่วยให้ตัดสินได้แม่นขึ้น', s:['ตั้งเวลาพักทุกหนึ่งชั่วโมง','กลับมาฟังด้วยความดังต่ำเพื่อเช็กโทนรวม'], ex:'ทำงานเป็นช่วงสั้น ๆ สลับกับการพัก แล้วจดว่าการตัดสินใจเปลี่ยนไปหรือไม่'},
  {t:'การแก้ปัญหาเมื่อ mix รกหรือแบน', p:'ถ้า mix รกให้ย้อนกลับไปตัดสิ่งที่ไม่จำเป็นออกก่อน เช่น reverb หรือแทร็กที่ซ้ำกัน ถ้าแบนให้ตรวจการบีบและ saturation ที่สะสม การวินิจฉัยต้นเหตุก่อนปรับจะประหยัดเวลามาก', s:['ปิดแทร็กทีละตัวจนหาแทร็กที่ทำให้รก','ตรวจการบีบบน bus และปิดทีละตัวเพื่อดูผล'], ex:'เลือก mix ที่รกหรือแบน แล้วระบุสาเหตุหลักสามข้อก่อนแก้'},
  {t:'ทบทวน Mix bus ก่อนไปต่อ', p:'ตรวจว่า bus มี EQ คอมเพรสเซอร์ และ saturation ในลำดับที่เหมาะ โดยปรับแต่ละขั้นเพียงเล็กน้อย และเพลงยังนิ่งเมื่อเทียบกับอ้างอิง การทบทวนนี้เตรียมเพลงให้พร้อมเข้าสู่ขั้นตอน master', s:['เปิดปิดแต่ละขั้นของ bus ทีละตัวแล้วฟัง','ตรวจความดังรวมว่าอยู่ในช่วงปลอดภัย'], ex:'เขียนบันทึกค่าที่ปรับบน bus ทั้งหมดไว้เป็นอ้างอิงสำหรับวันที่ 6'}

  {t:'EQ แบบ Mastering', p:'EQ ที่ master ควรใช้ค่ากว้างและอ่อน เช่น shelf ที่ปรับราว ±1 dB เพื่อให้โทนรวมเข้าที่ ไม่ควรตัดหรือเพิ่มความถี่แคบ ๆ มากเพราะจะทำให้เสียงไม่เป็นธรรมชาติ ถ้าพบว่าต้องปรับเยอะ ให้กลับไปแก้ที่ Mix', s:['ใช้ low shelf และ high shelf ปรับทีละนิด แล้วฟังทั้งเพลง','เทียบกับเพลงอ้างอิงในความดังที่เท่ากัน'], ex:'ทำ master EQ ที่ปรับไม่เกิน 1 dB ทั้งหมด แล้วฟังว่าพอใจไหม'},
  {t:'Multiband Compression', p:'Multiband แยกสัญญาณเป็นย่านความถี่แล้วบีบแต่ละย่านแยกกัน เช่น ย่านเบส กลาง และแหลม ช่วยคุมเบสไม่ให้ดันจนเลอะโดยไม่ทำให้แหลมแบน จุดแบ่งย่านที่ใช้บ่อยอยู่ราว 100 Hz 500 Hz และ 5 kHz แต่ควรปรับตามเพลง', s:['เปิด multiband แล้วบีบเฉพาะย่านเบสประมาณ 1 dB','ค่อย ๆ เพิ่มย่านแหลมถ้าเสียงต้องการความเงา'], ex:'ทำ multiband ที่ปรับเพียงย่านเดียว แล้วเทียบ bypass ทุก 30 วินาที'},
  {t:'Limiter, True Peak และ LUFS', p:'Limiter ตั้ง ceiling ประมาณ -1 dBTP เพื่อกันคลิปหลังแปลงเป็น MP3 หรือ AAC LUFS คือหน่วยวัดความดังที่ใกล้กับการรับรู้ของหูมากกว่า dB แบบ peak Integrated LUFS วัดทั้งเพลง ส่วน short-term ดูช่วงสั้น แพลตฟอร์มหลายแห่งปรับความดังให้ใกล้ -14 LUFS ดังนั้นการทำให้ดังเกินอาจถูกลดลงโดยแพลตฟอร์มเอง', s:['วัด LUFS ของเพลงที่ master แล้วจดค่า Integrated','ตั้ง limiter ให้ True Peak ไม่เกิน -1 dBTP'], ex:'เปรียบเทียบเพลงสองเวอร์ชันที่ความดังต่างกัน 3 LUFS แล้วฟังว่าเวอร์ชันไหนน่าฟังกว่า'},
  {t:'Stereo width ที่ master', p:'การปรับความกว้างสเตอริโอที่ master ควรทำแบบ Mid/Side และเน้นย่านกลางถึงแหลม เบสควรอยู่เป็นโมโนเพื่อให้พลังและการส่งผ่านบนระบบเสียงต่าง ๆ ดีที่สุด การเพิ่มความกว้างมากเกินไปทำให้ภาพเสียงฟุ้งและหายเมื่อเล่นเป็นโมโน', s:['เปิด Mid/Side แล้วลดด้านข้างของย่านต่ำให้เป็นโมโน','เพิ่มด้านข้างของย่านกลางถึงแหลมเล็กน้อย'], ex:'ปรับความกว้างของเพลงแล้วเช็กโมโนว่าเสียงหลักไม่หายไป'},
  {t:'Harmonic exciter และความสว่าง', p:'Exciter เพิ่มฮาร์มอนิกในย่านแหลมเพื่อให้เพลงสว่างและมีประกาย แต่ปริมาณที่มากเกินทำให้เสียงแสบหูและเหนื่อยเมื่อฟังนาน ควรใช้ในปริมาณน้อยเพื่อให้รู้สึกได้เฉพาะตอนเปิดปิดเทียบ', s:['เปิด exciter แล้วปิดสลับเพื่อเทียบความต่าง','ปรับให้เสียงสว่างขึ้นโดยไม่แสบ'], ex:'ใช้ exciter กับเพลงหนึ่งเพลงแบบเบาที่สุดที่ยังรู้สึกได้ แล้วจดค่าที่ใช้'},
  {t:'Dither และการลดความลึกบิต', p:'เมื่อส่งออกจาก 24 บิตลงเหลือ 16 บิต การตัดความละเอียดโดยตรงทำให้เกิดเสียงรบกวนที่มีรูปแบบซ้ำ dither เพิ่มเสียงรบกวนเล็กน้อยที่กระจายสม่ำเสมอเพื่อให้ไม่ได้ยินความผิดเพี้ยนนั้น ควรใช้ dither เป็นขั้นตอนสุดท้ายเท่านั้น', s:['เปิดตัวเลือก dither ตอนส่งออกไฟล์ 16 บิต','เปรียบเทียบไฟล์ที่มีและไม่มี dither ในห้องเงียบ'], ex:'ส่งออกไฟล์สองแบบ แบบมีและไม่มี dither แล้วฟังในห้องเงียบ'},
  {t:'Loudness และความรู้สึกดัง', p:'เพลงที่ดังมากไม่ได้ให้ผลดีที่สุดเสมอ การบีบจนเสียงเต็มเพดานทำให้ไดนามิกหายและเหนื่อยหู ความดังที่สมดุลกับเนื้อเพลงให้ความรู้สึกที่ดีกว่า และแพลตฟอร์มมักปรับเพลงที่ดังเกินให้ลดลงอยู่แล้ว', s:['ทำ master สองเวอร์ชันที่ความดังต่างกันเล็กน้อย','ฟังแล้วจดว่าเวอร์ชันไหนน่าฟังซ้ำ'], ex:'เลือกเวอร์ชันที่น่าฟังซ้ำที่สุด แล้วอธิบายเหตุผลสั้น ๆ ด้วยคำของตัวเอง'},
  {t:'Mastering บนหลายอุปกรณ์', p:'เพลงที่ผ่าน master ต้องฟังได้บนหูฟัง ลำโพง รถยนต์ และมือถือ การทดสอบข้ามอุปกรณ์เผยปัญหาที่ซ่อนอยู่ เช่นเสียงเบสที่หายบนมือถือหรือเสียงแหลมที่แข็งบนหูฟัง', s:['เล่นเพลงทั้งเพลงในอุปกรณ์สี่แบบ','จดปัญหาที่พบในแต่ละอุปกรณ์แยกกัน'], ex:'ทดสอบ master ของคุณบนอุปกรณ์สี่แบบ แล้วบันทึกปัญหาที่พบมากที่สุด'},
  {t:'Track sequencing และช่องว่างระหว่างเพลง', p:'สำหรับอัลบั้มหรือชุดเพลง ระดับความดังและโทนต้องสม่ำเสมอระหว่างเพลง การจัดลำดับเพลงและกำหนดช่องว่างระหว่างเพลงให้เหมาะช่วยให้การฟังต่อเนื่องราบรื่น', s:['เทียบความดังเฉลี่ยของทุกเพลงในชุด','ปรับช่องว่างระหว่างเพลงให้สม่ำเสมอ'], ex:'จัดลำดับเพลงสามเพลงแล้วฟังต่อเนื่องเพื่อดูว่าความดังไหลลื่นหรือไม่'},
  {t:'ตรวจ True Peak และการแปลงไฟล์', p:'หลังการแปลงเป็น MP3 หรือ AAC อาจเกิดปลายยอดที่สูงขึ้นซึ่งไม่เห็นในไฟล์ต้นฉบับ การกำหนด True Peak ให้ต่ำกว่า 0 dB อยู่บ้างช่วยกันคลิปที่เกิดขึ้นตอนแปลงไฟล์', s:['แปลงไฟล์ master เป็น MP3 แล้วตรวจคลิป','ปรับ ceiling ให้ปลอดภัยถ้าพบคลิป'], ex:'แปลงไฟล์ master เป็น MP3 แล้วฟังหาคลิปในช่วงที่ดังที่สุด'},
  {t:'ทบทวน Master ก่อนไปต่อ', p:'ตรวจว่าโซ่ master เรียบง่ายและทำงานอย่างตั้งใจ ไม่มีปลั๊กอินที่ทำงานซ้ำกัน ค่าความดังอยู่ในช่วงที่ตั้งใจ และ True Peak ปลอดภัย การทบทวนนี้ทำให้งาน master พร้อมส่งและมั่นใจได้', s:['ไล่ดูทีละขั้นของโซ่ master','ตรวจค่า LUFS และ True Peak ครั้งสุดท้าย'], ex:'เขียนเช็กลิสต์ master ของตัวเองสิบข้อแล้วใช้กับเพลงถัดไป'}
],

 deep:[
  {t:'จัด Session ให้เป็นระบบ', p:'ตั้งชื่อแทร็ก bus และ send ให้ชัด จัดสีแยกกลุ่ม เช่น ดรัม เบส คีย์ และเสียงร้อง เก็บโปรเจกต์พร้อมไฟล์สำรอง และ export Mix แยกก่อนเข้า master เพื่อให้กลับมาแก้ได้ง่ายในภายหลัง', s:['แยกแทร็กเป็นกลุ่มพร้อม bus ของแต่ละกลุ่ม','สำรองโปรเจกต์พร้อมไฟล์เสียงที่ใช้ทั้งหมด'], ex:'จัดโปรเจกต์ของคุณตามกลุ่มนี้ภายใน 20 นาที'},
  {t:'เลือกเพลงอ้างอิงอย่างไร', p:'เพลงอ้างอิงที่ดีควรเป็นเพลงที่คุณคุ้นหู มีแนวคล้ายกัน และผลิตดี ควรฟังบนลำโพงและหูฟังที่คุ้นเคย แล้วจดว่ากลองเบสและเสียงร้องอยู่ตรงไหนในความดังและโทน', s:['เลือกเพลงอ้างอิง 3 เพลงที่มีแนวเดียวกัน','เทียบความดังและโทนก่อนปรับเพลงของเรา'], ex:'ทำรายการเพลงอ้างอิง 3 เพลงแล้วเขียนสิ่งที่ชอบในแต่ละเพลง'},
  {t:'เกณฑ์ประเมินงานสุดท้าย', p:'งานที่ดีควรผ่านเกณฑ์ เช่น ไม่มี clip ความดังใกล้เป้าหมาย LUFS ระบบโมโนไม่หายไปมาก เสียงหลักชัดในทุกอุปกรณ์ และไม่มีความถี่ใดรบกวนหูเป็นพิเศษ เขียนบันทึกสั้น ๆ ว่าปรับอะไรไปบ้างและเพราะอะไร เพื่อให้เรียนรู้ซ้ำได้ในงานถัดไป', s:['ฟังงานในอุปกรณ์สามแบบ แล้วจดปัญหาที่พบ','ใส่บันทึกการปรับแต่งทุกขั้นตอน'], ex:'ส่งงาน Mix และ Master พร้อมบันทึกการปรับแต่งให้ผู้สอนดูหรือเก็บเป็นผลงาน'},
  {t:'วางแผนการทำงานทีละขั้น', p:'การทำเพลงให้จบต้องมีลำดับที่ชัดเจน เริ่มจากการจัดโปรเจกต์ แก้ปัญหาพื้นฐาน ทำ mix หยาบ ปรับรายละเอียด แล้วจึงทำ master การแยกขั้นตอนช่วยไม่ให้วนกลับไปแก้สิ่งที่เสร็จแล้วซ้ำ ๆ', s:['เขียนลำดับงานห้าขั้นก่อนเริ่มเพลงใหม่','ติ๊กทีละขั้นเมื่อทำเสร็จจริง'], ex:'วางแผนงานของเพลงหนึ่งเพลงตามลำดับห้าขั้น แล้วทำตามให้ครบโดยไม่ย้อนกลับ'},

// ---- Build navigation and content ----
const nav = document.getElementById('nav');
const main = document.getElementById('main');
let html = '';
DAYS.forEach((d, i) => {
  const n = i + 1;
  nav.insertAdjacentHTML('beforeend', `<a href="#d${n}">วัน${n}</a>`);
  html += `
  <section class="day" id="d${n}">
    <div class="day-head">
      <div class="num">${n}</div>
      <div><h2>${d.t}</h2><span class="hours">${d.h}</span></div>
    </div>
    <p class="card goal"><b>เป้าหมาย:</b> ${d.goal}</p>
    <div class="grid">
      ${d.items.map(([h, p]) => `<div class="card"><h3>${h}</h3><p>${p}</p></div>`).join('')}
    </div>
    ${d.kp ? `<h3 class="sub">ข้อสำคัญ 10 ข้อ</h3><ol class="kp">${d.kp.map(x => `<li>${x}</li>`).join('')}</ol>` : ''}
    ${d.deep ? `<h3 class="sub">บทเรียนเชิงลึก</h3>` + d.deep.map((l, k) => `
      <details class="card lesson"${k === 0 ? ' open' : ''}>
        <summary><h3>${k + 1}. ${l.t}</h3></summary>
        <p>${l.p}</p>
        <ol class="steps">${l.s.map(x => `<li>${x}</li>`).join('')}</ol>
        <p class="ex"><b>แบบฝึกหัด:</b> ${l.ex}</p>
      </details>`).join('') : ''}
    <div class="tip">${d.tip}</div>
    ${d.demo ? `
    <div class="card demo">
      <h3>ลองปรับ Compressor</h3>
      <p>สัญญาณเข้าคงที่ที่ -10 dB ลองขยับ threshold และ ratio แล้วดูว่าเสียงถูกบีบไปเท่าไร</p>
      <label>Threshold: <span id="tv">-18</span> dB</label>
      <input id="th" type="range" min="-40" max="0" value="-18">
      <label>Ratio: <span id="rv">4</span>:1</label>
      <input id="ra" type="range" min="1" max="10" value="4">
      <div class="meter"><i id="mi"></i></div>
      <div class="out" id="go"></div>
    </div>` : ''}
    ${d.svg ? `<figure class="viz">${d.svg}</figure>` : ''}
  </section>`;
});
main.innerHTML = html;

// ---- Compressor demo ----
const th = document.getElementById('th'), ra = document.getElementById('ra');
function updDemo() {
  const T = +th.value, R = +ra.value, L = -10;
  const out = L > T ? T + (L - T) / R : L;
  const gr = L - out;
  document.getElementById('tv').textContent = T;
  document.getElementById('rv').textContent = R;
  document.getElementById('mi').style.width = Math.max(0, Math.min(100, (out + 60) / 60 * 100)) + '%';
  document.getElementById('go').textContent = 'ลดลง ' + gr.toFixed(1) + ' dB (ออก ' + out.toFixed(1) + ' dB)';
}
if (th) { th.addEventListener('input', updDemo); ra.addEventListener('input', updDemo); updDemo(); }

// ---- Progress bar ----
addEventListener('scroll', () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  document.getElementById('bar').style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
});

// ---- 3D hero (Three.js) ----
(function () {
  const host = document.getElementById('hero3d');
  const W = () => host.clientWidth, H = () => host.clientHeight;
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(45, W() / H(), 0.1, 100);
  cam.position.set(0, 1.5, 13);
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  r.setSize(W(), H());
  host.appendChild(r.domElement);

  const g = new THREE.Group();
  scene.add(g);
  const cols = [0xFFE14D, 0xFF5DA2, 0x4DE8FF, 0xB8FF5C, 0xFF8A3D];
  const line = new THREE.LineBasicMaterial({ color: 0x0d0d0d });
  const geo = new THREE.BoxGeometry(0.5, 1, 0.5);
  const edges = new THREE.EdgesGeometry(geo);
  const bars = [];
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: cols[i % cols.length] }));
    m.add(new THREE.LineSegments(edges, line));
    m.position.x = (i - 11.5) * 0.7;
    g.add(m);
    bars.push(m);
  }

  const cgeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
  const cube = new THREE.Mesh(cgeo, new THREE.MeshBasicMaterial({ color: 0xFF5DA2 }));
  cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(cgeo), line));
  cube.position.set(-7, 4, -2);
  scene.add(cube);

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let visible = true;
  new IntersectionObserver(e => {
    const was = visible;
    visible = e[0].isIntersecting;
    if (visible && !was) frame();
  }).observe(host);
  const t0 = performance.now();
  function frame() {
    const t = (performance.now() - t0) / 1000;
    bars.forEach((m, i) => {
      const s = 1.2 + Math.abs(Math.sin(t * 2.2 + i * 0.45)) * 3.2 + Math.abs(Math.cos(t * 1.1 + i * 0.9)) * 1.4;
      m.scale.y = s;
      m.position.y = -2.5 + s / 2;
    });
    g.rotation.y = Math.sin(t * 0.25) * 0.35;
    cube.rotation.x = t * 0.6;
    cube.rotation.y = t * 0.8;
    cube.position.y = 4 + Math.sin(t) * 0.6;
    r.render(scene, cam);
    if (!reduce && visible) requestAnimationFrame(frame);
  }
  frame();
  addEventListener('resize', () => {
    cam.aspect = W() / H();
    cam.updateProjectionMatrix();
    r.setSize(W(), H());
  });
})();
</script>
