var exp = document.querySelector('.experience');
var pre = document.getElementById('preloader');
var preVideo = document.getElementById('preloader-video');
var preCount = document.getElementById('preloader-count');
var preValue = document.getElementById('preloader-value');
var logo = document.getElementById('floating-logo');
var title = document.getElementById('planet-title');
var factsEl = document.getElementById('facts');
var planetList = document.querySelector('.planet-list');

var nextNum = document.getElementById('next-number');
var portalBtn = document.getElementById('portal');
var portalVideo = document.getElementById('portal-video');
var portalImg = document.getElementById('portal-image');
var transVideo = document.getElementById('transition-video');
var portalCanvas = document.getElementById('portal-canvas');
var ctx = portalCanvas.getContext('2d');
var sceneCanvas = document.getElementById('scene-canvas');
var sctx = sceneCanvas.getContext('2d');
var cursor = document.querySelector('.custom-cursor');
var dot = document.querySelector('.cursor-dot');
var orbit = document.querySelector('.cursor-orbit');

var current = 'mars';
var busy = false;
var expansion = 0, maskScale = 0, canvasOpacity = 1;
var rotX = 0, rotY = 0, targetX = 0, targetY = 0;
var transitionActive = false, frozen = false;
var firstRender = true;

function easeInOutCubic(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
function animateValue(setter, duration){
  return new Promise(function(res){
    var t0 = null;
    function f(t){
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0)/duration);
      setter(easeInOutCubic(p));
      if (p < 1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
}
function mediaReady(v, timeout){
  return new Promise(function(res){
    if (v.readyState >= 3) return res();
    var done = false, to = setTimeout(fin, timeout);
    function fin(){
      if (done) return; done = true;
      v.removeEventListener('canplaythrough', fin);
      v.removeEventListener('error', fin);
      clearTimeout(to); res();
    }
    v.addEventListener('canplaythrough', fin);
    v.addEventListener('error', fin);
  });
}
function videoEnded(v, timeout){
  return new Promise(function(res){
    if (v.ended) return res();
    var done = false, to = setTimeout(fin, timeout);
    function fin(){
      if (done) return; done = true;
      v.removeEventListener('ended', fin);
      clearTimeout(to); res();
    }
    v.addEventListener('ended', fin);
  });
}
function mediaSize(m){ return [m.videoWidth || m.naturalWidth || 0, m.videoHeight || m.naturalHeight || 0]; }
function drawCoverCtx(c, m){
  var s = mediaSize(m);
  if (!s[0] || !s[1]) return;
  var sc = Math.max(window.innerWidth/s[0], window.innerHeight/s[1]);
  var w = s[0]*sc, h = s[1]*sc;
  c.drawImage(m, (window.innerWidth-w)/2, (window.innerHeight-h)/2, w, h);
}
function drawShade(c){
  var g = c.createLinearGradient(0, window.innerHeight*.52, 0, window.innerHeight);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.88)');
  c.fillStyle = g;
  c.fillRect(0, window.innerHeight*.52, window.innerWidth, window.innerHeight*.48);
}
function resizeCanvas(){
  var d = Math.min(window.devicePixelRatio || 1, 2);
  portalCanvas.width = window.innerWidth*d;
  portalCanvas.height = window.innerHeight*d;
  portalCanvas.style.width = window.innerWidth + 'px';
  portalCanvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
  if (!frozen) {
    sceneCanvas.width = window.innerWidth*d;
    sceneCanvas.height = window.innerHeight*d;
    sctx.setTransform(d, 0, 0, d, 0, 0);
  }
}
function roundedRectPoints(w, h, r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  var corners = [
    [ w/2-r, -h/2+r, -Math.PI/2, 0],
    [ w/2-r,  h/2-r, 0, Math.PI/2],
    [-w/2+r,  h/2-r, Math.PI/2, Math.PI],
    [-w/2+r, -h/2+r, Math.PI, Math.PI*1.5]
  ];
  var pts = [];
  corners.forEach(function(c){
    for (var i = 0; i <= 10; i++){
      var a = c[2] + (c[3]-c[2])*(i/10);
      pts.push([c[0] + r*Math.cos(a), c[1] + r*Math.sin(a)]);
    }
  });
  return pts;
}
var lastT = 0;
function draw(now){
  requestAnimationFrame(draw);
  var dt = Math.min(40, now - (lastT || now));
  lastT = now;
  rotX += (targetX - rotX) * Math.min(1, dt*.009);
  rotY += (targetY - rotY) * Math.min(1, dt*.009);
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  if (frozen) {
    ctx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
    drawShade(ctx);
  }
  var rect = portalBtn.getBoundingClientRect();
  var rcx = rect.left + rect.width/2, rcy = rect.top + rect.height/2;
  var cx = rcx + (window.innerWidth/2 - rcx)*expansion;
  var cy = rcy + (window.innerHeight/2 - rcy)*expansion;
  var baseW = rect.width + (window.innerWidth - rect.width)*expansion;
  var baseH = rect.height + (window.innerHeight - rect.height)*expansion;
  var s = expansion ? 1 : maskScale;
  var w = baseW*s, h = baseH*s;
  var r = 90*(1-expansion)*s;
  var rx = rotX*(1-expansion), ry = rotY*(1-expansion);
  if (w > 1 && h > 1) {
    var pts = roundedRectPoints(w, h, r);
    var ax = rx*Math.PI/180, ay = ry*Math.PI/180;
    var ca = Math.cos(ax), sa = Math.sin(ax), cb = Math.cos(ay), sb = Math.sin(ay);
    ctx.save();
    ctx.globalAlpha = canvasOpacity;
    ctx.beginPath();
    pts.forEach(function(p, i){
      var xx = p[0]*cb, yy = p[1]*ca, z = p[0]*sb - p[1]*sa;
      var pr = 850/(850+z);
      var sx = cx + xx*pr, sy = cy + yy*pr;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = '#030303';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    drawCoverCtx(ctx, transitionActive ? transVideo : (states[current].image ? portalImg : portalVideo));
    if (transitionActive) drawShade(ctx);
    ctx.restore();
  }
}
function fitTitle(){
  title.style.fontSize = '';
  var content = document.querySelector('.planet-content');
  var dl = document.getElementById('facts');
  var block = window.innerWidth <= 640;
  var avail = block ? content.clientWidth : content.clientWidth - dl.offsetWidth - 40;
  if (avail < 160) avail = 160;
  var size = parseFloat(window.getComputedStyle(title).fontSize);
  var guard = 0;
  while (title.scrollWidth > avail && size > 36 && guard < 80) {
    size -= 4;
    title.style.fontSize = size + 'px';
    guard++;
  }
}
function render(){
  var st = states[current];
  exp.dataset.planet = current;
  title.textContent = st.name.toUpperCase();
  nextName.textContent = st.next;
  nextNum.textContent = st.number;
  portalBtn.setAttribute('aria-label', 'Travel to ' + st.next);
  factsEl.innerHTML = '';
  st.facts.forEach(function(f){
    var d = document.createElement('div');
    d.className = 'fact';
    var dt = document.createElement('dt');
    dt.textContent = f[0];
    var dd = document.createElement('dd');
    dd.textContent = f[1];
    d.appendChild(dt); d.appendChild(dd);
    factsEl.appendChild(d);
  });
  planetList.innerHTML = '';
  planets.forEach(function(p){
    var s = document.createElement('span');
    s.className = 'planet-item' + (p.toLowerCase() === current ? ' active' : '');
    s.textContent = p;
    planetList.appendChild(s);
  });
  if (!firstRender) {
    planetList.classList.remove('is-switching');
    void planetList.offsetWidth;
    planetList.classList.add('is-switching');
  }
  firstRender = false;
  document.querySelectorAll('.background').forEach(function(v){
    v.classList.toggle('is-visible', v.id === st.background);
  });
  if (st.image) {
    if (portalImg.getAttribute('src') !== st.image) portalImg.src = st.image;
    portalImg.style.visibility = 'visible';
    portalVideo.style.visibility = 'hidden';
    try { portalVideo.pause(); } catch (e) {}
  } else {
    portalImg.style.visibility = 'hidden';
    portalVideo.style.visibility = 'visible';
    if (portalVideo.getAttribute('src') !== st.portal) portalVideo.src = st.portal;
    portalVideo.loop = true;
    try { portalVideo.load(); } catch (e) {}
    try { var p = portalVideo.play(); if (p && p.catch) p.catch(function(){}); } catch (e) {}
  }
  fitTitle();
}
function revealMask(){
  exp.classList.remove('mask-revealing');
  void exp.offsetWidth;
  exp.classList.add('mask-revealing');
  maskScale = 0;
  return animateValue(function(v){ maskScale = v; }, 1050);
}
function revealPlanetContent(){
  exp.classList.remove('content-revealing');
  void exp.offsetWidth;
  exp.classList.add('content-revealing');
}
async function startExperience(){
  try {
    if (portalVideo.getAttribute('src') !== states[current].portal) portalVideo.src = states[current].portal;
    portalVideo.muted = true;
    try { portalVideo.load(); } catch (e) {}
    await mediaReady(portalVideo, 4000);
    portalVideo.loop = true;
    try { await portalVideo.play(); } catch (e) {}
  } catch (e) {}
  await revealMask();
  document.body.classList.add('intro-ready');
  setTimeout(revealPlanetContent, 850);
}
async function travel(){
  if (busy || current === 'venus') return;
  busy = true;
  targetX = 0; targetY = 0;
  var next = current === 'mars' ? 'earth' : 'venus';
  try {
    transVideo.loop = false;
    transVideo.muted = true;
    if (transVideo.getAttribute('src') !== states[current].portal) transVideo.src = states[current].portal;
    try { transVideo.load(); } catch (e) {}
    exp.classList.add('is-loading');
    await mediaReady(transVideo, 1600);
    exp.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
    exp.classList.add('is-transitioning');
    transVideo.currentTime = 0;
    transVideo.playbackRate = 1.3;
    canvasOpacity = 1;
    transitionActive = true;
    try { await transVideo.play(); } catch (e) {}
    await animateValue(function(v){ expansion = v; }, 1100);
    await videoEnded(transVideo, 15000);
    var d = Math.min(window.devicePixelRatio || 1, 2);
    sceneCanvas.width = window.innerWidth*d;
    sceneCanvas.height = window.innerHeight*d;
    sctx.setTransform(d, 0, 0, d, 0, 0);
    drawCoverCtx(sctx, transVideo);
    frozen = true;
    current = next;
    exp.classList.add('is-committing');
    render();
    await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
    transitionActive = false;
    expansion = 0;
    maskScale = 0;
    canvasOpacity = 1;
    exp.classList.remove('is-transitioning', 'is-committing');
    var maskReveal = revealMask();
    setTimeout(revealPlanetContent, 100);
    await maskReveal;
    await new Promise(function(r){ setTimeout(r, 450); });
    frozen = false;
    transVideo.removeAttribute('src');
    try { transVideo.load(); } catch (e) {}
    busy = false;
  } catch (err) {
    transitionActive = false;
    expansion = 0;
    maskScale = 1;
    canvasOpacity = 1;
    exp.classList.remove('is-loading', 'is-transitioning', 'is-committing');
    busy = false;
  }
}
function runPreloader(){
  var v = preVideo, finished = false, begun = false;
  try { v.muted = true; } catch (e) {}
  function finish(){
    if (finished) return;
    finished = true;
    preValue.textContent = '100';
    preCount.classList.add('is-leaving');
    logo.classList.add('is-docked');
    pre.classList.add('is-background');
    document.body.classList.add('preload-complete');
    startExperience();
    setTimeout(function(){ if (preCount.parentNode) preCount.parentNode.removeChild(preCount); }, 750);
    setTimeout(function(){ logo.classList.add('is-settled'); }, 2000);
  }
  setTimeout(finish, 12000);
  function tick(){
    try {
      if (v.duration) preValue.textContent = String(Math.round(v.currentTime/v.duration*100));
    } catch (e) {}
    if (!finished) requestAnimationFrame(tick);
  }
  function begin(){
    if (begun) return;
    begun = true;
    try { v.playbackRate = Math.max(.25, v.duration/3); } catch (e) {}
    try {
      var p = v.play();
      if (p && p.catch) p.catch(function(){ finish(); });
    } catch (e) { finish(); return; }
    requestAnimationFrame(tick);
  }
  v.addEventListener('ended', finish);
  v.addEventListener('error', finish);
  if (v.readyState >= 1) {
    begin();
  } else {
    var to = setTimeout(begin, 5000);
    v.addEventListener('loadedmetadata', function(){ clearTimeout(to); begin(); }, {once:true});
    v.addEventListener('error', function(){ clearTimeout(to); }, {once:true});
  }
}
var curX = 0, curY = 0, orbX = 0, orbY = 0, cursorSeen = false;
window.addEventListener('pointermove', function(e){
  curX = e.clientX; curY = e.clientY;
  dot.style.transform = 'translate3d(' + curX + 'px,' + curY + 'px,0) translate(-50%,-50%)';
  if (!cursorSeen) { cursorSeen = true; cursor.classList.add('is-visible'); }
}, {passive:true});
document.documentElement.addEventListener('mouseleave', function(){
  cursor.classList.remove('is-visible');
});
function cursorLoop(){
  requestAnimationFrame(cursorLoop);
  orbX += (curX - orbX)*.2;
  orbY += (curY - orbY)*.2;
  var sc = cursor.classList.contains('is-enter') ? ' scale(1.16)' : '';
  orbit.style.transform = 'translate3d(' + orbX + 'px,' + orbY + 'px,0) translate(-50%,-50%)' + sc;
}
portalBtn.addEventListener('pointerenter', function(){ cursor.classList.add('is-enter'); });
portalBtn.addEventListener('pointerleave', function(){ cursor.classList.remove('is-enter'); });
window.addEventListener('pointermove', function(e){
  if (busy) return;
  if (e.pointerType && e.pointerType !== 'mouse') return;
  targetY = (e.clientX/window.innerWidth - .5) * 37.4;
  targetX = (e.clientY/window.innerHeight - .5) * -33;
}, {passive:true});
document.addEventListener('pointerleave', function(){
  targetX = 0; targetY = 0;
});
portalBtn.addEventListener('click', travel);
window.addEventListener('resize', function(){ resizeCanvas(); fitTitle(); });

document.querySelectorAll('.background').forEach(function(v){
  try { v.pause(); v.currentTime = 0; } catch (e) {}
});
resizeCanvas();
render();
requestAnimationFrame(draw);
requestAnimationFrame(cursorLoop);
runPreloader();
})();
